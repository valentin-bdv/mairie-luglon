<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Programme — page déplacée</title>

    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/styles.css">

    <!-- ============================================================
         REDIRECTION — /programme/ → /evenements/fetes-de-luglon/

         Cette page a été déplacée lors du passage d'un site « Fêtes de
         Luglon 2026 » à un site du Comité des Fêtes, actif toute l'année.
         L'URL /programme/ a circulé sur Facebook, dans des e-mails de
         confirmation et dans l'index de Google : elle ne doit pas
         renvoyer une 404.

         GitHub Pages ne permet pas de redirection HTTP 301. On combine
         donc trois mécanismes, du plus universel au plus rapide :
           1. <link rel="canonical">  → dit à Google quelle est la vraie URL
           2. <meta http-equiv="refresh"> → marche sans JavaScript
           3. location.replace()      → instantané, et n'ajoute PAS d'entrée
                                        dans l'historique (sinon le bouton
                                        « retour » reboucle ici sans fin)
         Un lien visible reste affiché : si les trois échouent, le visiteur
         n'est pas coincé sur une page blanche.
         ============================================================ -->
    <link rel="canonical" href="https://cdf-luglon.fr/evenements/fetes-de-luglon/">
    <meta http-equiv="refresh" content="0; url=/evenements/fetes-de-luglon/">
    <meta name="robots" content="noindex, follow">
    <script>location.replace('/evenements/fetes-de-luglon/');</script>
</head>
<body>
    <div class="wrap res-wrap">
        <main class="card legal-card">
            <h2>Cette page a déménagé</h2>
            <p>
                Le programme des Fêtes de Luglon se trouve désormais sur la page
                dédiée à l'évènement.
            </p>
            <p>
                <a class="nav-button" href="/evenements/fetes-de-luglon/">
                    Aller à la page des Fêtes de Luglon
                </a>
            </p>
            <p class="legal-updated">
                Vous êtes redirigé automatiquement. Si rien ne se passe, utilisez le
                bouton ci-dessus.
            </p>
        </main>
    </div>
</body>
</html>
